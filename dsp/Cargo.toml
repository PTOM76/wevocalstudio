[package]
name = "wevocalstudio-dsp"
version = "0.1.0"
edition = "2021"

# 処理は wevocal-lib（WeVocalSynth と同じもの）。隣の WeVocalSynth の中のものを使う
[dependencies]
wevocal-lib = { path = "../../wevocalsynth/wevocal-lib" }

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
